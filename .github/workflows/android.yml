name: Android app

# Builds the RideSync Flutter app (mobile/) into an Android APK on every push to main,
# or by hand from the Actions tab. The APK is attached to the "Android app (latest)"
# release so it can be downloaded straight to a phone.
#
# Play Store: when the repository secrets RIDESYNC_UPLOAD_KEYSTORE_B64 (the upload key, base64)
# and RIDESYNC_UPLOAD_PASSWORD are set, it also builds RideSync.aab signed with that private
# upload key (download it from the run's artifacts and upload it in Play Console). The APKs stay
# on the shared test key so phones that installed them from GitHub can keep updating.
# Every build gets a higher version code (the run number), as Play Console requires.
#
# The online server address built into the app: our Oracle server
# (https://ridesync-vit.duckdns.org). The repository variable RIDESYNC_SERVER_URL
# (Settings → Secrets and variables → Actions → Variables) replaces it if set.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze && flutter test

      - name: Phone notifications (Firebase)
        env:
          # Optional repository secret: the whole google-services.json from the Firebase console.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/google-services.json
            python3 tool/firebase_android.py /tmp/google-services.json
            rm /tmp/google-services.json
          else
            echo "Phone notifications: off (add the GOOGLE_SERVICES_JSON secret to turn them on)"
          fi

      - name: Build settings
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          GM=false
          if [ -n "$GOOGLE_MAPS_ANDROID_KEY" ]; then GM=true; fi
          echo "Google Maps in the app: $GM"
          echo "BUILD_ARGS=--release --build-number=${{ github.run_number }} --dart-define=RIDESYNC_SERVER_URL=${{ vars.RIDESYNC_SERVER_URL || 'https://ridesync-vit.duckdns.org' }} --dart-define=GOOGLE_MAPS=$GM --dart-define=RIDESYNC_BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          # Optional repository secret: a Google Maps key restricted to Android apps.
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          # One APK that works on every phone, plus a smaller one for modern (64-bit) phones.
          flutter build apk $BUILD_ARGS
          flutter build apk --split-per-abi $BUILD_ARGS

      - name: Build Play Store bundle (AAB)
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.RIDESYNC_UPLOAD_KEYSTORE_B64 }}
          RIDESYNC_UPLOAD_PASSWORD: ${{ secrets.RIDESYNC_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$RIDESYNC_UPLOAD_PASSWORD" ]; then
            echo "Play Store bundle: skipped (add RIDESYNC_UPLOAD_KEYSTORE_B64 and RIDESYNC_UPLOAD_PASSWORD secrets)"
            exit 0
          fi
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          RIDESYNC_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" flutter build appbundle $BUILD_ARGS
          rm -f "$RUNNER_TEMP/upload.jks"
          cp build/app/outputs/bundle/release/app-release.aab RideSync.aab

      - name: Publish APK
        # Only main updates the public download; test runs on other branches keep their files as artifacts.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk RideSync.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk RideSync-small.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest RideSync-small.apk RideSync.apk \
            --target "${GITHUB_SHA}" \
            --title "Android app (latest)" \
            --prerelease \
            --notes "RideSync for Android (Flutter), built from commit ${GITHUB_SHA::7}. Download RideSync-small.apk (works on almost every phone from the last ~8 years). If it says the app is not compatible, use RideSync.apk instead. Open the file and allow installing from this source when asked."

      - uses: actions/upload-artifact@v4
        with:
          name: RideSync-android
          path: |
            mobile/RideSync.apk
            mobile/RideSync-small.apk

      - name: Upload Play Store bundle
        if: hashFiles('mobile/RideSync.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: RideSync-play-store-bundle
          path: mobile/RideSync.aab
