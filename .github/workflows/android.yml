name: Android app

# Builds the RideSync Flutter app (mobile/) into an Android APK on every push to main,
# or by hand from the Actions tab. The APK is attached to the "Android app (latest)"
# release so it can be downloaded straight to a phone.
#
# Optional repository variable RIDESYNC_SERVER_URL (Settings → Secrets and variables →
# Actions → Variables): the online server address to build into the app. Without it, the
# app asks for a server link on first launch (e.g. the share.bat link from a laptop).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze && flutter test

      - name: Phone notifications (Firebase)
        env:
          # Optional repository secret: the whole google-services.json from the Firebase console.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/google-services.json
            python3 tool/firebase_android.py /tmp/google-services.json
            rm /tmp/google-services.json
          else
            echo "Phone notifications: off (add the GOOGLE_SERVICES_JSON secret to turn them on)"
          fi

      - name: Build APKs
        env:
          # Optional repository secret: a Google Maps key restricted to Android apps.
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          GM=false
          if [ -n "$GOOGLE_MAPS_ANDROID_KEY" ]; then GM=true; fi
          echo "Google Maps in the app: $GM"
          ARGS="--release --dart-define=RIDESYNC_SERVER_URL=${{ vars.RIDESYNC_SERVER_URL }} --dart-define=GOOGLE_MAPS=$GM --dart-define=RIDESYNC_BUILD=${GITHUB_SHA::7}"
          # One APK that works on every phone, plus a smaller one for modern (64-bit) phones.
          flutter build apk $ARGS
          flutter build apk --split-per-abi $ARGS

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk RideSync.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk RideSync-small.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest RideSync-small.apk RideSync.apk \
            --target "${GITHUB_SHA}" \
            --title "Android app (latest)" \
            --prerelease \
            --notes "RideSync for Android (Flutter), built from commit ${GITHUB_SHA::7}. Download RideSync-small.apk (works on almost every phone from the last ~8 years). If it says the app is not compatible, use RideSync.apk instead. Open the file and allow installing from this source when asked."

      - uses: actions/upload-artifact@v4
        with:
          name: RideSync-android
          path: |
            mobile/RideSync.apk
            mobile/RideSync-small.apk
